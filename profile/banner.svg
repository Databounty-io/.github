<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">DataBounty</title>
  <desc id="desc">Community-built datasets with accountable human review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081712"/>
      <stop offset="1" stop-color="#10291e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6ff5c"/>
      <stop offset="1" stop-color="#61d69a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#background)"/>
  <path d="M0 300C190 246 311 325 506 268S804 173 992 231s195 55 288 0V360H0Z" fill="#153825" opacity=".55"/>
  <path d="M0 320C203 270 328 347 533 289s308-87 493-31 174 44 254 9" fill="none" stroke="#397252" stroke-width="1" opacity=".6"/>

  <g fill="none" stroke="#5dc788" stroke-width="2" opacity=".6">
    <path d="M920 101H1020L1097 155H1193"/>
    <path d="M920 251H1020L1097 197H1193"/>
    <path d="M1020 101V251"/>
    <path d="M1097 155V197"/>
  </g>
  <g fill="#b6ff5c" filter="url(#glow)">
    <circle cx="920" cy="101" r="7"/><circle cx="920" cy="251" r="7"/>
    <circle cx="1020" cy="101" r="7"/><circle cx="1020" cy="251" r="7"/>
    <circle cx="1097" cy="155" r="9"/><circle cx="1097" cy="197" r="9"/>
    <circle cx="1193" cy="155" r="7"/><circle cx="1193" cy="197" r="7"/>
  </g>

  <text x="80" y="84" fill="#b6ff5c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">COMMUNITY DATASETS · ACCOUNTABLE RELEASES</text>
  <text x="80" y="164" fill="#f3f8f4" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">DATA BOUNTY</text>
  <text x="80" y="216" fill="#d7e9dc" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="-.4">Turn a data gap into a release-ready dataset.</text>
  <rect x="80" y="260" width="514" height="1" fill="#67d69c" opacity=".55"/>
  <text x="80" y="300" fill="#a5bfad" font-family="Arial, Helvetica, sans-serif" font-size="19">Open specification · Human validation · Provenance · Contributor credit</text>
</svg>
